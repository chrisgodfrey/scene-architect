<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scene Architect browser verification</title>
<link rel="stylesheet" href="/styles/scene-architect.css">
<style id="browser-fixture-style">
body{background:#151922;color:#eee;font:15px system-ui;margin:20px}button,input,select,textarea{background:#292f3c;color:#eee;border:1px solid #687080;border-radius:4px;padding:7px;font:inherit}button{cursor:pointer}button:hover{background:#424b60}h1{font-size:22px}summary{cursor:pointer}.scene-architect{max-width:1000px;margin:auto}.sa-shell{min-width:0!important}.sa-actions>*{flex:1}.sa-actions{align-items:center}.sa-grid{margin-top:12px}#results{white-space:pre-wrap;color:#aeeebc;max-width:1000px;margin:auto}#assembly{display:block;max-width:1000px;width:100%;margin:20px auto}#banner{max-width:1000px;margin:20px auto;color:#e7c481}#samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}#samples figure{margin:0}#samples img{width:100%;height:auto}button:disabled{opacity:.55;cursor:not-allowed}

<details><summary>Deprecated renderer compatibility sample</summary><img id="assembly" alt="Laboratory assembled with synthetic test assets"></details>
